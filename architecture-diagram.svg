<svg width="760" height="1000" viewBox="0 0 760 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Robotic hand edge/cloud pipeline (phases 1–4)</title>
  <desc id="desc">Robot frames flow through an edge outbox, MQTT broker, deduplicating worker, multi-provider router, result claim and robot decision gate, with discard logging and safe defaults.</desc>

  <rect width="760" height="1000" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">Robotic hand — edge/cloud inference pipeline</text>
  <text x="380" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">Implemented phases 1–4: reliable delivery · multi-provider routing · conflict-safe decisions</text>

  <!-- Robot -->
  <rect x="260" y="76" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="380" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Robot</text>
  <text x="380" y="112" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#555555">Camera, sensors, actuators</text>
  <line x1="380" y1="132" x2="380" y2="156" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge capture + task context -->
  <rect x="260" y="160" width="240" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="380" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">Edge capture</text>
  <text x="380" y="195" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">task_id · attempt · frame time · deadline</text>
  <text x="380" y="211" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">JPEG compressed under ~100 KB</text>
  <line x1="380" y1="224" x2="380" y2="248" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outbox -->
  <rect x="260" y="252" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="380" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">SQLite outbox</text>
  <text x="380" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">pending before send → sent → acked</text>
  <line x1="380" y1="308" x2="380" y2="332" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Broker -->
  <rect x="260" y="336" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="380" y="354" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">MQTT broker (Mosquitto)</text>
  <text x="380" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#555555">QoS 1 · ACK topic · backoff resend</text>
  <line x1="380" y1="392" x2="380" y2="416" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worker -->
  <rect x="260" y="420" width="240" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="380" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Worker</text>
  <text x="380" y="455" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">dedup by task_id · re-ACK duplicates</text>
  <text x="380" y="471" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">result claim · result publish</text>
  <line x1="380" y1="484" x2="380" y2="508" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="260" y="512" width="240" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="380" y="530" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Router</text>
  <text x="380" y="547" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">health checks · circuit breaker · EWMA</text>
  <text x="380" y="563" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">timeout = remaining deadline / providers</text>

  <!-- Router to providers -->
  <line x1="330" y1="576" x2="190" y2="616" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="576" x2="380" y2="616" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="576" x2="570" y2="616" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="596" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">sequential failover</text>

  <!-- Providers -->
  <rect x="60" y="620" width="190" height="64" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="155" y="638" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Provider A (mock)</text>
  <text x="155" y="655" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#555555">controllable fail / slow / hang</text>
  <text x="155" y="670" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#555555">echoes task_id</text>

  <rect x="285" y="620" width="190" height="64" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="380" y="638" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Provider B (mock)</text>
  <text x="380" y="655" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#555555">controllable faults</text>
  <text x="380" y="670" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#555555">echoes task_id</text>

  <rect x="510" y="620" width="190" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="605" y="638" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">Real endpoint</text>
  <text x="605" y="655" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">RT-DETR (optional)</text>
  <text x="605" y="670" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">echoes task_id</text>

  <!-- Providers to results -->
  <line x1="190" y1="684" x2="320" y2="720" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="684" x2="380" y2="720" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="684" x2="440" y2="720" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Results claim -->
  <rect x="260" y="724" width="240" height="56" rx="8" fill="#FFF3E0" stroke="#E8963C" stroke-width="1"/>
  <text x="380" y="742" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#7A4100">Results claim</text>
  <text x="380" y="760" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8A5A1A">INSERT … ON CONFLICT DO NOTHING</text>
  <line x1="380" y1="780" x2="380" y2="804" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision gate -->
  <rect x="260" y="808" width="240" height="64" rx="8" fill="#FFF3E0" stroke="#E8963C" stroke-width="1"/>
  <text x="380" y="826" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#7A4100">Robot decision gate</text>
  <text x="380" y="843" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8A5A1A">applied_ids · deadline · newer frame</text>
  <text x="380" y="859" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8A5A1A">apply once | safe default | discard late</text>

  <!-- Gate to actuation -->
  <line x1="380" y1="872" x2="380" y2="896" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Actuation -->
  <rect x="260" y="900" width="240" height="48" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="380" y="917" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Actuation</text>
  <text x="380" y="934" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#555555">motor control stays local</text>

  <!-- Discard log -->
  <rect x="570" y="808" width="170" height="78" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1"/>
  <text x="655" y="826" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#7B241C">Discarded log</text>
  <text x="655" y="843" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#922B21">duplicate · late · mismatch</text>
  <text x="655" y="859" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#922B21">never dropped silently</text>
  <text x="655" y="875" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#922B21">received_at recorded</text>
  <line x1="500" y1="840" x2="566" y2="840" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ACK feedback -->
  <path d="M260 452 L200 452 L200 280 L256 280" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <text x="196" y="366" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56" transform="rotate(-90 196 366)">ACK marks outbox acked</text>

  <text x="380" y="978" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">Teal = on-site / edge · Purple = cloud · Orange = conflict handling · Red = rejected responses</text>
</svg>
