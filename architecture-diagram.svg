<svg width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="630" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Robot -->
  <rect x="220" y="40" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Robot</text>
  <text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#555555">Camera, sensors</text>
  <line x1="340" y1="96" x2="340" y2="136" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge controller -->
  <rect x="220" y="136" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Edge controller</text>
  <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#555555">Buffers and retries</text>
  <line x1="340" y1="192" x2="340" y2="232" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Message broker -->
  <rect x="220" y="232" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Message broker</text>
  <text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#555555">MQTT, QoS levels</text>
  <line x1="340" y1="288" x2="340" y2="328" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <rect x="220" y="328" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Local GPU available?</text>
  <text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#555555">Routes the request</text>

  <text x="252" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">yes</text>
  <line x1="320" y1="384" x2="235" y2="424" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">no</text>
  <line x1="360" y1="384" x2="455" y2="424" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Local GPU -->
  <rect x="130" y="424" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="230" y="442" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">Local GPU</text>
  <text x="230" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Zero network delay</text>

  <!-- Cloud GPU -->
  <rect x="355" y="424" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="455" y="442" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Cloud GPU</text>
  <text x="455" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Rented, pay per use</text>

  <line x1="230" y1="480" x2="325" y2="520" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="480" x2="355" y2="520" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Response -->
  <rect x="220" y="520" width="240" height="56" rx="8" fill="#f5f5f3" stroke="#888888" stroke-width="1"/>
  <text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Response to robot</text>
  <text x="340" y="556" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#555555">Acked and retried</text>

  <text x="340" y="606" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Teal = on-site compute · Purple = cloud compute</text>
</svg>
