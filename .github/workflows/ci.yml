name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        env:
          # The broker-backed tests start Mosquitto in a later step.
          SKIP_PHASE2_DOCKER_TESTS: "1"
        run: python -m pytest -q -m "not real_model and not pybullet"

      - name: Start Mosquitto
        run: |
          docker compose up -d
          docker compose ps

      - name: Start mock inference server
        run: |
          python -m mock_server --port 8000 &
          echo $! > /tmp/mock_server.pid
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "mock server ready"
              exit 0
            fi
            sleep 1
          done
          echo "mock server did not start"
          exit 1

      - name: Run broker tests (Phase 2 and Phase 3)
        run: python -m pytest tests/phase2 tests/phase3 -q -m "not real_model and not pybullet"

      - name: Stop Mosquitto
        if: always()
        run: docker compose down

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/mock_server.pid ]; then
            kill "$(cat /tmp/mock_server.pid)" || true
          fi
